databases:
  - name: sre-agent-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: sre_agent
    user: sre_agent
    ipAllowList: []

services:
  - type: web
    name: sre-agent
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m backend.migrations upgrade --require-current
    startCommand: sh -c 'uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-10000}'
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: sre-agent-db
          property: connectionString
      - key: SRE_ENVIRONMENT
        value: production
      - key: SRE_LOG_FORMAT
        value: json
      - key: SRE_LOG_LEVEL
        value: INFO
      - key: SRE_SEED_DEMO_DATA
        value: "false"
      - key: SRE_REQUIRE_REAL_DATA_SOURCE
        value: "true"
      - key: SRE_DATA_API_BASE
        sync: false
      - key: SRE_DATA_API_TOKEN
        sync: false
      - key: SRE_AUTH_ENABLED
        value: "true"
      - key: SRE_ADMIN_API_KEY
        sync: false
      - key: SRE_ALLOW_INSECURE_DB_SECRETS
        value: "false"
      - key: SRE_WORKSPACE_ID
        value: default
      - key: SRE_WORKSPACE_NAME
        value: SRE Agent workspace
      - key: SRE_PLAN
        value: trial
      - key: SRE_MONTHLY_REQUEST_LIMIT
        value: "1000"
      - key: EXECUTION_GUARD_ENABLED
        value: "true"
      - key: EXECUTION_GUARD_TOKEN
        sync: false
      - key: SRE_CHANGE_EXECUTION_MODE
        value: queued
      - key: SRE_CHANGE_EXECUTOR
        value: simulation
      - key: SRE_CHANGE_EXECUTOR_WEBHOOK_URL
        sync: false
      - key: SRE_CHANGE_EXECUTOR_TOKEN
        sync: false
      - key: SRE_OUTBOUND_HOST_ALLOWLIST
        sync: false
      - key: SRE_ALLOW_PRIVATE_NETWORK_TARGETS
        value: "false"
      - key: SRE_PRODUCTION_WRITE_ENABLED
        value: "false"

  - type: worker
    name: sre-agent-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.worker
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: sre-agent-db
          property: connectionString
      - key: SRE_ENVIRONMENT
        value: production
      - key: SRE_LOG_FORMAT
        value: json
      - key: SRE_LOG_LEVEL
        value: INFO
      - key: SRE_CHANGE_JOB_MAX_ATTEMPTS
        value: "1"
      - key: SRE_CHANGE_WORKER_POLL_SECONDS
        value: "1"
      - key: SRE_WORKER_HEARTBEAT_INTERVAL_SECONDS
        value: "10"
      - key: SRE_WORKER_HEARTBEAT_MAX_AGE_SECONDS
        value: "90"
      - key: SRE_CHANGE_EXECUTOR
        fromService:
          name: sre-agent
          type: web
          envVarKey: SRE_CHANGE_EXECUTOR
      - key: SRE_CHANGE_EXECUTOR_WEBHOOK_URL
        fromService:
          name: sre-agent
          type: web
          envVarKey: SRE_CHANGE_EXECUTOR_WEBHOOK_URL
      - key: SRE_CHANGE_EXECUTOR_TOKEN
        fromService:
          name: sre-agent
          type: web
          envVarKey: SRE_CHANGE_EXECUTOR_TOKEN
      - key: SRE_OUTBOUND_HOST_ALLOWLIST
        fromService:
          name: sre-agent
          type: web
          envVarKey: SRE_OUTBOUND_HOST_ALLOWLIST
      - key: SRE_ALLOW_PRIVATE_NETWORK_TARGETS
        fromService:
          name: sre-agent
          type: web
          envVarKey: SRE_ALLOW_PRIVATE_NETWORK_TARGETS
      - key: SRE_PRODUCTION_WRITE_ENABLED
        fromService:
          name: sre-agent
          type: web
          envVarKey: SRE_PRODUCTION_WRITE_ENABLED
